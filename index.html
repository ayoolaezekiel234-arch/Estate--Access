    function escapeHtml(unsafe) {
      if (!unsafe) return "";
      return unsafe.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function playBeep(type) {
      try {
        var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(type === 'success' ? 600 : 200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      } catch(e) {}
    }

    async function updateNetworkStatus() {
      var indicator = document.getElementById("network-indicator");
      if (!indicator) return;
      try {
        var { error } = await supabaseClient.from('resident_profiles').select('user_id').limit(1);

          indicator.textContent = "🟢 Cloud Secure";
          indicator.style.color = "#15803d";
          indicator.style.background = "#dcfce7";

          indicator.textContent = "⚠️ Cloud Disconnected";

        indicator.textContent = "🔴 Offline Mode";
        indicator.style.color = "#b91c1c";
        indicator.style.background = "#fee2e2";
      }
    }

          var heroBtn = document.getElementById("hero-pass-btn");

          alert("🔒 Restricted: This gate tablet is locked to the Guard Terminal.");
          tab = 'guard';
        }

        var protectedViews = ['resident', 'biker-portal', 'admin-post'];
        if (protectedViews.includes(tab)) {
          var sessionRes = await supabaseClient.auth.getSession();
          if (!sessionRes.data.session) {
            alert("🔒 Please sign in securely via the 🔐 tab first.");
            tab = 'auth';
          }
        }

        var views = ['auth', 'visitor', 'business-portal', 'resident', 'directory', 'complaints', 'news', 'admin-post', 'guard', 'biker-portal'];
        views.forEach(function(v) {
          var el = document.getElementById("view-" + v);
          if (el) el.style.display = (v === tab) ? 'block' : 'none';

        if (tab === 'guard') { renderActiveSOSFeeds(); }

    // 🔐 OFFICIAL SUPABASE AUTH LOGIN WITH EXPLICIT ERROR HANDLING
    async function handleLogin() {
      var emailEl = document.getElementById("auth-email");
      var passwordEl = document.getElementById("auth-password");
      var msg = document.getElementById("auth-status-msg");

      if (!emailEl || !passwordEl) return;
      var email = emailEl.value.trim();
      var password = passwordEl.value.trim();

      if (!email || !password) {
        msg.style.color = "#b91c1c";
        msg.innerText = "❌ Please enter email and password.";
        return;
      }

      msg.style.color = "#0369a1";
      msg.innerText = "⏳ Connecting to Supabase Auth...";

      try {
        if (isRegistering) {
          var fullName = document.getElementById("reg-fullname")?.value.trim() || "Chief Owueme Mitchelle";
          var phone = document.getElementById("reg-phone")?.value.trim() || "08108429710";
          var address = document.getElementById("reg-address")?.value.trim() || "Plot 14, Road A";

          var { data, error } = await supabaseClient.auth.signUp({ 
            email: email, 
            password: password,
            options: { data: { full_name: fullName, phone: phone, address: address } }
          });

          if (error) {
            msg.style.color = "#b91c1c";
            msg.innerText = "❌ " + error.message;
            return;
          }

          // Provision profile row in database
          if (data && data.user) {
            await supabaseClient.from('resident_profiles').upsert([{
              user_id: data.user.id,
              full_name: fullName,
              phone: phone,
              address: address,
              rfid_tag: "NITEL-R-" + Math.floor(10000 + Math.random() * 90000),
              access_status: "AUTHORIZED",
              levy_status: "PENDING",
              family_members: []
            }], { onConflict: 'user_id' });
          }

          msg.style.color = "#15803d";
          msg.innerText = "🟢 Account Created! You can now sign in.";
          isRegistering = false;
          document.getElementById("signup-extra-fields").style.display = "none";
          document.getElementById("signup-mode-btn").innerText = "Register Account";
          return;
        }

        var { data, error } = await supabaseClient.auth.signInWithPassword({ 
          email: email, 
          password: password 
        });

        if (error) {
          msg.style.color = "#b91c1c";
          msg.innerText = "❌ " + error.message;
          return;
        }

        msg.style.color = "#15803d";
        msg.innerText = "🟢 Authenticated Successfully!";
        document.getElementById("sign-out-btn").style.display = "block";
        playBeep('success');
        setTimeout(function() { switchTab('resident'); }, 800);

      } catch (err) {
        msg.style.color = "#b91c1c";
        msg.innerText = "❌ Authentication error. Please try again.";
      }
    }

    async function addHouseholdMember() {

        var name = document.getElementById("fam-member-name").value.trim();

    async function requestEstateBike() {
      try {
        var sessionRes = await supabaseClient.auth.getSession();
        if (!sessionRes.data.session) { alert("Sign in required."); switchTab('auth'); return; }
        var user = sessionRes.data.session.user;

        var { data: profile } = await supabaseClient.from('resident_profiles').select('*').eq('user_id', user.id).maybeSingle();
        if (!profile) { alert("Resident profile required."); return; }

        var source = document.getElementById("pickup-source-select")?.value;
        var pickupAddr = source === 'custom' ? document.getElementById("custom-pickup-input")?.value.trim() : profile.address;
        if (!pickupAddr) { alert("Please provide a valid pickup address."); return; }

        var dest = document.getElementById("biker-dest-input")?.value.trim() || "Estate Gate";
        var passengers = document.getElementById("biker-passengers")?.value || "1";
        var notes = document.getElementById("biker-note-input")?.value.trim() || "";

        var reqBtn = document.getElementById("request-bike-btn");
        if (reqBtn) { reqBtn.disabled = true; reqBtn.innerText = "Dispatching Biker..."; }

        var reqId = 'req_' + Date.now();
        var { error } = await supabaseClient.from('estate_biker_requests').insert([{
          id: reqId,
          resident_id: user.id,
          resident_name: profile.full_name,
          resident_phone: profile.phone,
          pickup_address: pickupAddr,
          destination: dest,
          passengers: passengers,
          special_instructions: notes,
          status: 'REQUESTED'
        }]);

        if (error) {
          alert("Dispatch Error: " + error.message);
          if (reqBtn) { reqBtn.disabled = false; reqBtn.innerText = "Request Estate Bike 🏍️"; }
          return;
        }

        currentActiveRequestId = reqId;
        var statusBox = document.getElementById("biker-request-status-box");
        if (statusBox) {
          statusBox.style.display = "block";
          statusBox.style.background = "#eff6ff";
          statusBox.style.color = "#1e40af";
          statusBox.innerText = "⏳ Request Broadcasted — Automatically selecting an available biker...";
        }
        document.getElementById("cancel-bike-btn").style.display = "block";
        if (reqBtn) { reqBtn.style.display = "none"; }

        startBikerDispatchPoll(reqId);
      } catch(e) {}
    }

    function startBikerDispatchPoll(reqId) {
      if (activeBikerTimer) clearInterval(activeBikerTimer);
      activeBikerTimer = setInterval(async function() {
        try {
          var { data: req } = await supabaseClient.from('estate_biker_requests').select('*').eq('id', reqId).maybeSingle();
          if (!req) return;

          var statusBox = document.getElementById("biker-request-status-box");
          var assignedCard = document.getElementById("assigned-biker-card");
          var infoBox = document.getElementById("assigned-biker-info");

          if (req.status === 'REQUESTED') {
            await assignAvailableBiker(reqId);
          } else if (req.status === 'ASSIGNED' || req.status === 'BIKER_ACCEPTED') {
            if (statusBox) statusBox.style.display = "none";
            if (assignedCard) assignedCard.style.display = "block";
            if (infoBox) {
              infoBox.innerHTML = "<b>Biker ID:</b> " + escapeHtml(req.assigned_biker_id || 'NITEL-BK-09') + "<br><b>Status:</b> " + escapeHtml(req.status) + "<br><i>Biker is heading to " + escapeHtml(req.pickup_address) + "</i>";
            }
            playBikerAlertTone();
          } else if (req.status === 'COMPLETED') {
            clearInterval(activeBikerTimer);
            if (statusBox) { statusBox.style.display = "block"; statusBox.style.background = "#dcfce7"; statusBox.style.color = "#15803d"; statusBox.innerText = "🟢 Biker Trip Completed Successfully!"; }
            resetBikerUI();
          }
        } catch(e) {}
      }, 4000);
    }

    async function assignAvailableBiker(reqId) {
      try {
        var { data: bikers } = await supabaseClient.from('estate_bikers').select('*').eq('status', 'ONLINE');
        if (!bikers || bikers.length === 0) return;

        var eligible = bikers.filter(function(b) { return b.availability === 'AVAILABLE'; });
        if (eligible.length === 0) return;

        var selectedBiker = eligible[Math.floor(Math.random() * eligible.length)];

        await supabaseClient.from('estate_biker_requests').update({
          assigned_biker_id: selectedBiker.bike_id,
          status: 'ASSIGNED'
        }).eq('id', reqId).eq('status', 'REQUESTED');
      } catch(e) {}
    }

    async function cancelEstateBikeRequest() {
      if (!currentActiveRequestId) return;
      try {
        await supabaseClient.from('estate_biker_requests').update({ status: 'CANCELLED' }).eq('id', currentActiveRequestId);
        if (activeBikerTimer) clearInterval(activeBikerTimer);
        alert("❌ Biker request cancelled.");
        resetBikerUI();
      } catch(e) {}
    }

    function resetBikerUI() {
      currentActiveRequestId = null;
      document.getElementById("biker-request-status-box").style.display = "none";
      document.getElementById("cancel-bike-btn").style.display = "none";
      document.getElementById("assigned-biker-card").style.display = "none";
      var reqBtn = document.getElementById("request-bike-btn");
      if (reqBtn) { reqBtn.style.display = "block"; reqBtn.disabled = false; reqBtn.innerText = "Request Estate Bike 🏍️"; }
    }

    async function loadBikerDashboard() {
      var bikeId = document.getElementById("biker-login-id").value.trim().toUpperCase();
      if (!bikeId) { alert("Enter your Bike ID."); return; }

      var { data: biker } = await supabaseClient.from('estate_bikers').select('*').eq('bike_id', bikeId).maybeSingle();

      document.getElementById("biker-live-terminal").style.display = "block";
      playBeep('success');
      pollBikerTerminal(bikeId);
    }

    function pollBikerTerminal(bikeId) {
      setInterval(async function() {
        try {
          var { data: requests } = await supabaseClient
            .from('estate_biker_requests')
            .select('*')
            .eq('assigned_biker_id', bikeId)
            .in('status', ['ASSIGNED', 'BIKER_ACCEPTED'])
            .order('created_at', { ascending: false });

          var feed = document.getElementById("incoming-biker-requests");
          if (!feed) return;

          if (!requests || requests.length === 0) {
            feed.innerHTML = "<small style='color:#64748b;'>No active ride assignments...</small>";
            return;
          }

          feed.innerHTML = requests.map(function(r) {
            return "<div style='background:#fff; border:1.5px solid #0f766e; padding:10px; border-radius:8px; font-size:11px; margin-bottom:6px;'>" +
              "<b>🏍️ RIDE DISPATCH: " + escapeHtml(r.resident_name) + "</b><br>" +
              "📍 <b>Pickup:</b> " + escapeHtml(r.pickup_address) + "<br>" +
              "🏁 <b>Destination:</b> " + escapeHtml(r.destination) + "<br>" +
              "📞 <b>Contact:</b> <a href='tel:" + escapeHtml(r.resident_phone) + "'>" + escapeHtml(r.resident_phone) + "</a><br>" +
              "<div style='display:flex; gap:6px; margin-top:8px;'>" +
                "<button type='button' onclick='acceptBikerRide(\"" + r.id + "\")' style='flex:1; background:#059669; color:#fff; border:none; padding:6px; border-radius:6px; font-weight:800; cursor:pointer;'>Accept Ride ✅</button>" +
                "<button type='button' onclick='completeBikerRide(\"" + r.id + "\")' style='flex:1; background:#0284c7; color:#fff; border:none; padding:6px; border-radius:6px; font-weight:800; cursor:pointer;'>Complete Trip 🏁</button>" +
              "</div>" +
            "</div>";
          }).join('');
        } catch(e) {}
      }, 4000);
    }

    async function acceptBikerRide(reqId) {
      await supabaseClient.from('estate_biker_requests').update({ status: 'BIKER_ACCEPTED' }).eq('id', reqId);
      playBeep('success');
      alert("🟢 Ride Accepted! Navigate to pickup address.");

    async function completeBikerRide(reqId) {
      await supabaseClient.from('estate_biker_requests').update({ status: 'COMPLETED' }).eq('id', reqId);

      alert("🏁 Trip marked completed.");

    async function registerEstateBiker(event) {
      if (event) event.preventDefault();
      var name = document.getElementById("adm-biker-name").value.trim();
      var bikeId = document.getElementById("adm-bike-id").value.trim().toUpperCase();
      var phone = document.getElementById("adm-biker-phone").value.trim();

      loadAdminBikers();

      var container = document.getElementById("admin-bikers-feed");

        return "<div style='background:#fff; border:1px solid #cbd5e1; padding:8px; border-radius:8px; font-size:11px; margin-bottom:4px;'><b>🏍️ " + escapeHtml(b.biker_name) + "</b> (" + escapeHtml(b.bike_id) + ") | 📞 " + escapeHtml(b.phone) + " | Status: <span style='color:#15803d; font-weight:800;'>" + escapeHtml(b.status) + "</span></div>";
      }).join('');

    async function pairGuardTerminal() {
      var code = document.getElementById("pairing-code-input").value.trim().toUpperCase();
      if (!code) { alert("⚠️ Please enter a valid pairing code."); return; }

      try {
        var { data: term, error } = await supabaseClient
          .from('guard_terminals')
          .select('*')
          .eq('pairing_code', code)
          .single();

        if (error || !term) {
          playBeep('error');
          alert("❌ Incorrect or invalid terminal pairing code.");
          return;
        }

        localStorage.setItem("nitel_paired_terminal", term.terminal_name + " (" + term.location + ")");
        playBeep('success');
        alert("🟢 Tablet Successfully Paired as " + term.terminal_name + "!");
        location.reload();
      } catch(e) {
        alert("❌ Error verifying pairing code.");
      }
    }

    async function triggerEmergencySOS() {
      playEmergencySiren();
      var session = await supabaseClient.auth.getSession();
      
      var residentName = "Estate Resident / Guest";
      var address = "NITEL Estate";
      var phone = "Not Provided";
      var userId = null;

      if (session.data && session.data.session) {
        userId = session.data.session.user.id;
        var { data: profile } = await supabaseClient.from('resident_profiles').select('*').eq('user_id', userId).maybeSingle();
        if (profile) {
          residentName = profile.full_name || residentName;
          address = profile.address || address;
          phone = profile.phone || phone;
        } else {
          residentName = session.data.session.user.email;
        }
      }

      var confirmSOS = confirm("🚨 EMERGENCY CONFIRMATION:\n\nThis will instantly broadcast a high-priority red alert to all Security Guards and Admins. Proceed?");
      if (!confirmSOS) return;

      try {
        var { error } = await supabaseClient.from('estate_sos_alerts').insert([{
          user_id: userId, resident_name: residentName, address: address, phone: phone, status: 'ACTIVE'
        }]);

        if (error) { alert("SOS Error: " + error.message); return; }
        playEmergencySiren();
        alert("🚨 EMERGENCY SOS BROADCASTED SUCCESSFULLY!");
        switchTab('guard');
      } catch(e) { alert("Unable to trigger SOS."); }
    }

    async function submitBusinessRegistration(event) {
      if (event) event.preventDefault();
      var submitBtn = document.getElementById("biz-submit-btn");
      var photoInput = document.getElementById("biz-photos-input");

      try {
        var bName = document.getElementById("biz-name")?.value.trim();
        var categoryText = document.getElementById("biz-category-text")?.value.trim();
        var shopNo = document.getElementById("biz-shop-no")?.value.trim();
        var avenue = document.getElementById("biz-avenue")?.value.trim();
        var ownerName = document.getElementById("biz-owner-name")?.value.trim();
        var phone = document.getElementById("biz-owner-phone")?.value.trim();

        if (!bName || !ownerName || !phone || !shopNo || !avenue || !categoryText) {
          alert("Please complete all required fields.");
          return;
        }

        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.style.opacity = "0.6";
          submitBtn.innerText = "Uploading Photos & Submitting...";
        }

        var { data: existing } = await supabaseClient
          .from('estate_businesses')
          .select('business_name')
          .ilike('business_name', bName);

        if (existing && existing.length > 0) {
          alert("❌ A business with the name '" + bName + "' is already registered or pending review!");
          if (submitBtn) { submitBtn.disabled = false; submitBtn.style.opacity = "1"; submitBtn.innerText = "Submit Business to Cloud DB"; }
          return;
        }

        var photoPublicUrls = [];
        if (photoInput && photoInput.files && photoInput.files.length > 0) {
          var filesToProcess = Array.from(photoInput.files).slice(0, 3);
          for (var file of filesToProcess) {
            var fileExt = file.name.split('.').pop();
            var fileName = 'biz_' + Date.now() + '_' + Math.random().toString(36.substring(2)) + '.' + fileExt;
            var filePath = 'public/' + fileName;

            var { error: uploadError } = await supabaseClient.storage
              .from('business-photos')
              .upload(filePath, file, { cacheControl: '3600', upsert: false });

            if (!uploadError) {
              var { data: publicUrlData } = supabaseClient.storage
                .from('business-photos')
                .getPublicUrl(filePath);
              if (publicUrlData) {
                photoPublicUrls.push(publicUrlData.publicUrl);
              }
            }
          }
        }

        var business = {
          id: 'biz_' + Date.now(),
          business_name: bName,
          category: categoryText,
          location: shopNo + ", " + avenue,
          owner_name: ownerName,
          phone: phone,
          photos: photoPublicUrls,
          status: "PENDING"
        };

        var { error } = await supabaseClient.from('estate_businesses').insert([business]);
        if (error) { 
          alert("Cloud DB Error: " + error.message); 
          if (submitBtn) { submitBtn.disabled = false; submitBtn.style.opacity = "1"; submitBtn.innerText = "Submit Business to Cloud DB"; } 
          return; 
        }

        var resBox = document.getElementById("business-submit-result");
        if (resBox) {
          resBox.style.display = "block";
          resBox.innerText = "⏳ Business & photos submitted securely to Supabase Storage! Awaiting Admin Approval.";
        }
        document.getElementById("business-registration-form").reset();
        playBeep('success');
      } catch (error) {
        alert("Unable to submit business registration.");
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.style.opacity = "1";
          submitBtn.innerText = "Submit Business to Cloud DB";
        }
      }
    }

    async function generateVisitorPass(event) {
      if (event) event.preventDefault();
      var session = await supabaseClient.auth.getSession();
      if (!session.data.session) { alert("Authentication required."); switchTab('auth'); return; }

      var cat = document.getElementById("pass-category-group").value;
      var visitorName = document.getElementById('visitor-name')?.value.trim() || "General Attendee";
      var vehicle = document.getElementById('visitor-vehicle')?.value.trim() || "Walk-In";
      var pin = String(Math.floor(100000 + Math.random() * 900000));
      var opaqueToken = "NITEL-PRM-" + crypto.randomUUID();
      
      var durationHours = 24;
      if (cat === 'ARTISAN') durationHours = 2;
      else if (cat === 'CONTRACTOR') durationHours = 10;
      else if (cat === 'PROPERTY_ENQUIRY') durationHours = 1;
      else if (cat === 'CHURCH' || cat === 'MOSQUE') durationHours = 4;
      else if (cat === 'SPA' || cat === 'SUPERMARKET' || cat === 'FOOD_VENDOR' || cat === 'BUSINESS_APPOINTMENT') durationHours = 3;

      var expiresAt = new Date(Date.now() + durationHours * 3600 * 1000).toISOString();
      
      var hostField = document.getElementById('host-name');
      var locField = document.getElementById('visitor-location');
      var hostNameVal = hostField ? hostField.value.trim() : (cat + " Visitor");
      var locVal = locField ? locField.value : "Road A";

      var hostName = cat === 'PROPERTY_ENQUIRY' ? "Property Enquiry" : (hostNameVal + " (" + locVal + ")");

      var pass = { pin: pin, secure_token: opaqueToken, visitor_name: visitorName, host_name: hostName, vehicle: vehicle, pass_type: cat, status: "VALID", expires_at: expiresAt };
      var { error } = await supabaseClient.from('estate_passes').insert([pass]);
      if (error) { alert("Database Error: " + error.message); return; }
      
      var result = document.getElementById("visitor-result");
      result.classList.remove("hidden"); result.style.display = "block";
      document.getElementById("pass-display-pin").textContent = pin;
      document.getElementById("visitor-summary-display").innerHTML = "<b>Visitor:</b> " + escapeHtml(visitorName) + "<br><b>Details:</b> " + escapeHtml(hostName) + "<br><b>Duration:</b> " + durationHours + " Hours";
      
      var qrBox = document.getElementById("qrcode-box");
      if (qrBox && typeof QRCode !== "undefined") {
        qrBox.innerHTML = "";
        new QRCode(qrBox, { text: opaqueToken, width: 120, height: 120 });
      }
      playBeep('success');
    }

    async function verifyTokenOrPin(queryValue) {
      var res = document.getElementById("gate-result");
      res.style.display = "block";
      
      if (queryValue.startsWith("BUS-")) {
        var { data: biz, error } = await supabaseClient.from('estate_businesses').select('*').eq('permit_code', queryValue).maybeSingle();
        if (error || !biz || biz.status !== 'ACTIVE') {
          res.style.background = "#fee2e2"; res.style.color = "#b91c1c";
          res.innerHTML = "<b>⚠️ BUSINESS ACCESS DENIED</b><br>Status: " + escapeHtml(biz ? biz.status : "NOT FOUND");
          playBeep('error'); return;
        }
        res.style.background = "#f0fdf4"; res.style.color = "#0f172a";
        res.innerHTML = "<b>🟢 ACTIVE BUSINESS PERMIT</b><br>🏪 " + escapeHtml(biz.business_name) + "<br>👤 Owner: " + escapeHtml(biz.owner_name) + "<br>📍 " + escapeHtml(biz.location);
        playBeep('success');
        return;
      }

      if (queryValue.startsWith("NITEL-R-") || queryValue.startsWith("NITEL-F-")) {
        var { data: residents } = await supabaseClient.from('resident_profiles').select('*');
        var matchedResident = null;
        var matchedMember = null;

        if (residents) {
          residents.forEach(function(r) {
            if (r.rfid_tag === queryValue) { matchedResident = r; }
            if (r.family_members) {
              r.family_members.forEach(function(m) {
                if (m.rfid === queryValue) { matchedResident = r; matchedMember = m; }
              });
            }
          });
        }

        if (matchedResident) {
          if (matchedResident.access_status === 'REVOKED' || matchedResident.access_status === 'SUSPENDED') {
            res.style.background = "#fee2e2"; res.style.color = "#b91c1c";
            res.innerHTML = "<b>⚠️ ACCESS DENIED — CREDENTIAL " + escapeHtml(matchedResident.access_status) + "</b>";
            playBeep('error');
            return;
          }

          res.style.background = "#f0fdf4"; res.style.color = "#0f172a";
          if (matchedMember) {
            res.innerHTML = "<b>🟢 AUTHORIZED FAMILY MEMBER</b><br>👤 " + escapeHtml(matchedMember.name) + " (" + escapeHtml(matchedMember.role) + ")<br>🏠 Household: " + escapeHtml(matchedResident.full_name) + " (" + escapeHtml(matchedResident.address) + ")";
          } else {
            res.innerHTML = "<b>🟢 AUTHORIZED PERMANENT RESIDENT</b><br>👤 " + escapeHtml(matchedResident.full_name) + "<br>🏠 Address: " + escapeHtml(matchedResident.address) + "<br>💰 Levy Status: " + escapeHtml(matchedResident.levy_status || 'PENDING');
          }
          playBeep('success');
          return;
        }
      }

      var query = supabaseClient.from('estate_passes').select('*');
      if (queryValue.startsWith("NITEL-")) { query = query.eq('secure_token', queryValue); } else { query = query.eq('pin', queryValue); }
      var { data: found, error } = await query.maybeSingle();

      if (error || !found || found.status !== 'VALID' || new Date(found.expires_at) < new Date()) {
        res.style.background = "#fee2e2"; res.style.color = "#b91c1c";
        res.innerHTML = "<b>⚠️ ACCESS DENIED / EXPIRED PASS</b>";
        playBeep('error'); return;
      }
      res.style.background = "#f0fdf4"; res.style.color = "#0f172a";
      res.innerHTML = "<b>🟢 VALID — ACCESS PERMITTED</b><br>👤 " + escapeHtml(found.visitor_name) + "<br>📋 " + escapeHtml(found.host_name);
      playBeep('success');
    }
